name: CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install poetry
        run: pip install poetry
      - name: Install dependencies
        run: make install
      - name: Run tests and linter
        run: make check
