[project]
name = "hello-django"
version = "0.1.0"
description = "A simple Django app"
authors = [{name = "Hexlet Team", email = "info@hexlet.io"}]
license = "ISC"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.6,<7.0",
    "gunicorn>=20.1,<27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 80
# settings.py и manage.py это шаблон django-admin, его форму мы не ведём
extend-exclude = ["migrations", "settings.py", "manage.py"]

[tool.ruff.lint]
select = ["E", "F", "C90"]

[tool.ruff.lint.per-file-ignores]
# Django boilerplate stubs
"calc/admin.py" = ["F401"]
"calc/tests.py" = ["F401"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "hello_django.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
norecursedirs = ["__pycache__", ".venv", "*.egg", ".github"]
addopts = "--strict-markers"
