[tool.poetry]
name = "hello-django"
version = "0.1.0"
description = "A simple Django app"
authors = ["Hexlet Team <info@hexlet.io>"]
license = "ISC"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
Django = ">=4.1,<6.0"
gunicorn = ">=20.1,<27.0"

[tool.poetry.dev-dependencies]
pytest = "^9.0.3"
pytest-django = "^4.12.0"
wemake-python-styleguide = "^1.6.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
