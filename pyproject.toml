[project]
name = "hello-django"
version = "0.1.0"
description = "A simple Django app"
authors = [{name = "Hexlet Team", email = "info@hexlet.io"}]
license = "ISC"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.6,<7.0",
    "gunicorn>=20.1,<27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.15.20",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 80
extend-exclude = ["migrations"]

[tool.ruff.lint.per-file-ignores]
# Django boilerplate stubs
"hello_django/calc/admin.py" = ["F401"]
"hello_django/calc/tests.py" = ["F401"]
